[package]
name = "palantir-server"
version = "0.1.0"
description = "Headless Palantir instance: local agent execution over HTTP for Palantir's remote profile"
edition = "2021"

[[bin]]
name = "palantir-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tiny_http = "0.12"
